name: Build, tests and publication checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Swift tests
        run: scripts/test.sh
      - name: Python tests
        run: |
          python3 -m unittest discover -s skill/tests -v
          python3 -m unittest discover -s scripts/tests -v
      - name: Release build
        run: swift build -c release
      - name: Publication checks
        run: python3 scripts/check-publication.py
      - name: Scan history for credentials
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz -o "$scan_dir/gitleaks.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$scan_dir/checksums.txt"
          expected="$(awk '$2 == "gitleaks_8.30.1_darwin_arm64.tar.gz" {print $1}' "$scan_dir/checksums.txt")"
          test -n "$expected"
          echo "$expected  $scan_dir/gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git . --log-opts=--all --redact
